# Frontend only on Render. The FastAPI backend is deployed separately on Vercel (backend/vercel.json).
services:
  - type: web
    name: uniwise-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Set in the Render dashboard to your Vercel backend URL, e.g. https://uniwise-backend.vercel.app
      # (include https://, no trailing slash). Must be set BEFORE the build - Next.js bakes it in.
      - key: NEXT_PUBLIC_API_URL
        sync: false
